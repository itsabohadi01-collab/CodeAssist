name: Build and upload APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'     # trigger release when pushing a tag like v1.0.0
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: (Optional) Install Android SDK components
        # Uncomment / adjust if your build fails due to missing SDK components.
        # uses: r0adkll/setup-android@v2
        # with:
        #   api-level: 33
        #   build-tools: 33.0.2
        #   target: android-33

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/**') }}-${{ hashFiles('**/*.gradle*','**/gradle.properties') }}

      - name: Print environment info
        run: |
          java -version
          chmod +x gradlew
          ./gradlew -v || true

      - name: Build (assembleDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APKs
        run: |
          echo "Built APKs:"
          find . -type f -path "**/build/outputs/apk/**/*.apk" -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            **/build/outputs/apk/**/*.apk

  create_release:
    name: Create GitHub Release (on tag)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Show downloaded files
        run: |
          echo "Files in workspace:"
          ls -R

      - name: Create Release and upload APK(s)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          files: 'apk/**/*.apk'
